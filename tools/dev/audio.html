<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PaperAudio test</title>
<style>
  :root { --bg: #f4efe3; --ink: #3a3128; --btn: #fffaf0; --line: #c9bba4; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, sans-serif; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  section { margin: 16px 0; }
  button { font: inherit; padding: 10px 14px; margin: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--btn); cursor: pointer; }
  button:active { transform: translateY(1px); }
  label { margin-right: 16px; }
  #log { font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; background: #fff8; padding: 8px; border-radius: 6px; max-height: 40vh; overflow: auto; }
</style>
</head>
<body>
<h1>PaperAudio test bench</h1>
<p>Click any button (the first click unlocks audio).</p>
<section>
  <button id="up">Flap up</button>
  <button id="down">Fold flat</button>
  <button id="upLow">Flap up (low, big card)</button>
  <button id="upHigh">Flap up (high, small card)</button>
  <button id="rapid">Rapid 20 folds</button>
  <button id="wave">Wave: 30 up then 30 flat</button>
</section>
<section>
  <button id="stepL">Step left</button>
  <button id="stepR">Step right</button>
  <button id="walk">Walk 8 steps</button>
  <button id="run">Run 12 steps</button>
</section>
<section>
  <label>Master <input id="vol" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
  <label>Gain <input id="gain" type="range" min="0" max="1" step="0.01" value="0.8" /></label>
  <label>Pan <input id="pan" type="range" min="-1" max="1" step="0.01" value="0" /></label>
</section>
<div id="log"></div>

<script type="module">
import { PaperAudio } from '/src/systems/PaperAudio.ts';

const audio = new PaperAudio();
const $ = (id) => document.getElementById(id);
const log = (s) => { $('log').textContent = s + '\n' + $('log').textContent.slice(0, 4000); };
const g = () => +$('gain').value;
const p = () => +$('pan').value;
const rnd = (a, b) => a + Math.random() * (b - a);

document.addEventListener('pointerdown', () => audio.unlock(), { capture: true });
$('vol').addEventListener('input', (e) => audio.setMasterVolume(+e.target.value));

$('up').onclick = () => { audio.flap({ pitch: rnd(0.9, 1.1), gain: g(), pan: p(), up: true }); log('flap up'); };
$('down').onclick = () => { audio.flap({ pitch: rnd(0.9, 1.1), gain: g(), pan: p(), up: false }); log('fold flat'); };
$('upLow').onclick = () => audio.flap({ pitch: 0.72, gain: g(), pan: p(), up: true });
$('upHigh').onclick = () => audio.flap({ pitch: 1.38, gain: g(), pan: p(), up: true });
$('rapid').onclick = () => {
  for (let i = 0; i < 20; i++) {
    setTimeout(() => audio.flap({ pitch: rnd(0.75, 1.35), gain: rnd(0.4, 1), pan: rnd(-0.8, 0.8), up: Math.random() < 0.6 }), i * 45 + rnd(0, 20));
  }
  setTimeout(() => log(`rapid 20 done, active voices ${audio.activeVoices}`), 1000);
};
$('wave').onclick = () => {
  for (let i = 0; i < 60; i++) {
    const up = i < 30;
    setTimeout(() => audio.flap({ pitch: rnd(0.8, 1.25), gain: rnd(0.5, 0.9), pan: Math.sin(i * 0.5) * 0.7, up }), i * 90 + (up ? 0 : 600));
  }
};
$('stepL').onclick = () => audio.step(0, 0.5);
$('stepR').onclick = () => audio.step(1, 0.5);
$('walk').onclick = () => { for (let i = 0; i < 8; i++) setTimeout(() => audio.step(i % 2, 0.5), i * 320); };
$('run').onclick = () => { for (let i = 0; i < 12; i++) setTimeout(() => audio.step(i % 2, 1), i * 200); };

// ---------------------------------------------------------------- offline render + analysis
// Used by the verification script (window.__renderSuite) — renders WAVs and measures them.
const SR = 48000;

async function render(seconds, schedule, seed) {
  const ctx = new OfflineAudioContext(2, Math.ceil(SR * seconds), SR);
  const a = new PaperAudio({ context: ctx, seed });
  const events = schedule(a);
  const buf = await ctx.startRendering();
  return { buf, events };
}

function fftMag(x) {
  const n = x.length; // power of two
  const re = Float64Array.from(x), im = new Float64Array(n);
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    for (let i = 0; i < n; i += len) {
      for (let k = 0; k < len / 2; k++) {
        const wr = Math.cos(ang * k), wi = Math.sin(ang * k);
        const ur = re[i + k], ui = im[i + k];
        const vr = re[i + k + len / 2] * wr - im[i + k + len / 2] * wi;
        const vi = re[i + k + len / 2] * wi + im[i + k + len / 2] * wr;
        re[i + k] = ur + vr; im[i + k] = ui + vi;
        re[i + k + len / 2] = ur - vr; im[i + k + len / 2] = ui - vi;
      }
    }
  }
  const mag = new Float64Array(n / 2);
  for (let i = 0; i < n / 2; i++) mag[i] = Math.hypot(re[i], im[i]);
  return mag;
}

const db = (v) => (v > 0 ? 20 * Math.log10(v) : -Infinity);
const r2 = (v) => Math.round(v * 100) / 100;

function mono(buf) {
  const l = buf.getChannelData(0), r = buf.getChannelData(1);
  const m = new Float32Array(l.length);
  for (let i = 0; i < l.length; i++) m[i] = 0.5 * (l[i] + r[i]);
  return m;
}

function segmentStats(m, s0, s1) {
  let peak = 0, sum2 = 0;
  for (let i = s0; i < s1; i++) { const a = Math.abs(m[i]); if (a > peak) peak = a; sum2 += m[i] * m[i]; }
  // audible length: span above peak-40 dB
  const thr = peak * 0.01;
  let first = -1, last = -1;
  for (let i = s0; i < s1; i++) if (Math.abs(m[i]) > thr) { if (first < 0) first = i; last = i; }
  // spectral centroid on Hann-windowed 8192 frame from event start
  const N = 8192, frame = new Float64Array(N);
  for (let i = 0; i < N && s0 + i < s1; i++) frame[i] = m[s0 + i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (N - 1)));
  const mag = fftMag(frame);
  let num = 0, den = 0, lo = 0, hi = 0;
  for (let k = 1; k < mag.length; k++) { const f = k * SR / N; const p = mag[k] * mag[k]; num += f * p; den += p; if (f < 250) lo += p; if (f > 3000) hi += p; }
  return { lowPct: Math.round(100 * lo / den), highPct: Math.round(100 * hi / den), peakDb: r2(db(peak)), rmsDb: r2(db(Math.sqrt(sum2 / Math.max(1, last - first + 1)))), lenMs: r2((last - first) / SR * 1000), centroidHz: Math.round(num / den) };
}

function globalStats(buf) {
  let peak = 0, sum2 = 0, sum = 0, clipped = 0, maxJump = 0;
  const n = buf.length;
  for (let c = 0; c < buf.numberOfChannels; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < n; i++) {
      const v = d[i], a = Math.abs(v);
      if (a > peak) peak = a;
      if (a >= 0.999) clipped++;
      sum += v; sum2 += v * v;
      if (i) { const j = Math.abs(v - d[i - 1]); if (j > maxJump) maxJump = j; }
    }
  }
  const tot = n * buf.numberOfChannels;
  // edge samples should be silent
  const firstAbs = Math.abs(buf.getChannelData(0)[0]), lastAbs = Math.abs(buf.getChannelData(0)[n - 1]);
  return { peakDb: r2(db(peak)), rmsDb: r2(db(Math.sqrt(sum2 / tot))), dc: +(sum / tot).toExponential(2), clipped, maxSampleJump: +maxJump.toFixed(4), edge: [firstAbs, lastAbs] };
}

function summarize(list) {
  const pick = (k) => list.map((e) => e[k]);
  const s = (arr) => {
    const mean = arr.reduce((a, b) => a + b, 0) / arr.length;
    const sd = Math.sqrt(arr.reduce((a, b) => a + (b - mean) ** 2, 0) / arr.length);
    return { min: Math.min(...arr), max: Math.max(...arr), mean: r2(mean), sd: r2(sd), cv: r2(sd / Math.abs(mean)) };
  };
  return { centroidHz: s(pick('centroidHz')), lowPct: s(pick('lowPct')), highPct: s(pick('highPct')), lenMs: s(pick('lenMs')), peakDb: s(pick('peakDb')) };
}

function wav16(buf) {
  const ch = buf.numberOfChannels, n = buf.length;
  const out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const w = (o, s) => { for (let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
  out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, SR, true); out.setUint32(28, SR * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true);
  w(36, 'data'); out.setUint32(40, n * ch * 2, true);
  const chans = []; for (let c = 0; c < ch; c++) chans.push(buf.getChannelData(c));
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < ch; c++) { const v = Math.max(-1, Math.min(1, chans[c][i])); out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2; }
  const bytes = new Uint8Array(out.buffer);
  let bin = ''; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

window.__renderSuite = async () => {
  const results = {};
  const rng = (() => { let a = 7; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; })();
  const spacing = 0.6;
  const seq = (name, n, fn) => async () => {
    const { buf, events } = await render(0.3 + n * spacing + 0.4, (a) => {
      const ev = [];
      for (let i = 0; i < n; i++) { const t = 0.3 + i * spacing; fn(a, t, i); ev.push(t); }
      return ev;
    }, 1234 + name.length);
    const m = mono(buf);
    const per = events.map((t) => segmentStats(m, Math.floor((t - 0.005) * SR), Math.floor((t + spacing - 0.01) * SR)));
    results[name] = { wav: wav16(buf), global: globalStats(buf), perEvent: per, summary: summarize(per) };
  };
  // identical arguments every call -> any spread is the module's own variation
  await seq('rising', 10, (a, t) => a.flap({ pitch: 1, gain: 0.8, pan: 0, up: true, time: t }))();
  await seq('falling', 10, (a, t) => a.flap({ pitch: 1, gain: 0.8, pan: 0, up: false, time: t }))();
  // the game's usual use: pitch spread across cards
  await seq('rising_pitched', 10, (a, t, i) => a.flap({ pitch: 0.7 + (i / 9) * 0.7, gain: 0.8, pan: -0.6 + i * 0.13, up: true, time: t }))();
  // steps: identical args, alternating feet (spacing reused so each is measured alone)
  await seq('steps', 8, (a, t, i) => a.step(i % 2, 0.6, t))();

  // dense bursts: 20 folds in 1 s, and 60 folds in 1.5 s (stress: voice limit + duck)
  for (const [name, n, span] of [['burst20', 20, 1.0], ['burst60', 60, 1.5]]) {
    let maxActive = 0;
    const { buf } = await render(span + 1.0, (a) => {
      for (let i = 0; i < n; i++) {
        a.flap({ pitch: 0.75 + rng() * 0.6, gain: 0.5 + rng() * 0.5, pan: rng() * 1.6 - 0.8, up: rng() < 0.6, time: 0.2 + (i / n) * span + rng() * 0.02 });
        maxActive = Math.max(maxActive, a.activeVoices);
      }
      return [];
    }, 99 + n);
    // short-term loudness: max 50 ms RMS window
    const m = mono(buf), W = Math.floor(0.05 * SR);
    let maxWin = 0;
    for (let s = 0; s + W < m.length; s += W / 2) { let q = 0; for (let i = s; i < s + W; i++) q += m[i] * m[i]; maxWin = Math.max(maxWin, Math.sqrt(q / W)); }
    results[name] = { wav: wav16(buf), global: globalStats(buf), maxRms50msDb: r2(db(maxWin)), maxActiveVoices: maxActive };
  }
  // single flap for loudness reference (max 50 ms RMS)
  {
    const { buf } = await render(1, (a) => { a.flap({ pitch: 1, gain: 1, pan: 0, up: true, time: 0.1 }); return []; }, 5);
    const m = mono(buf), W = Math.floor(0.05 * SR);
    let maxWin = 0;
    for (let s = 0; s + W < m.length; s += W / 2) { let q = 0; for (let i = s; i < s + W; i++) q += m[i] * m[i]; maxWin = Math.max(maxWin, Math.sqrt(q / W)); }
    results.single = { wav: wav16(buf), global: globalStats(buf), maxRms50msDb: r2(db(maxWin)) };
  }
  // CPU: wall-clock time to render 60 folds offline
  {
    const t0 = performance.now();
    await render(3, (a) => { for (let i = 0; i < 60; i++) a.flap({ pitch: 1, gain: 0.8, pan: 0, up: i % 2 === 0, time: 0.1 + i * 0.04 }); return []; }, 3);
    results.cpu = { render60FoldsMsFor3sAudio: Math.round(performance.now() - t0) };
  }
  return results;
};
window.__ready = true;
</script>
</body>
</html>
