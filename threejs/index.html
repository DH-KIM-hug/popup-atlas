<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#24160d">
<title>팝업 동화</title>
<style>
  @font-face { font-family: 'Pretendard'; src: url('./fonts/PretendardVariable.woff2') format('woff2'); font-weight: 45 920; font-display: block; }
  :root { --paper: #f6efdf; --ink: #3a2a1c; --edge: #d9c9a8; --wood: #5a3a22; --wood-dark: #24160d; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--wood-dark); touch-action: none; -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
  #c { display: block; position: fixed; inset: 0; width: 100vw; height: 100vh; }
  /* caption strip (story_ui.gd: paper box, speaker chip) */
  #cap { position: fixed; left: 12%; right: 12%; bottom: 2.54vh; min-height: 14vh; display: none; align-items: center; justify-content: center; gap: 18px;
    background: var(--paper); border-radius: 22px; box-shadow: 0 4px 0 var(--edge), 0 10px 24px rgba(0,0,0,.25); padding: 12px 28px; box-sizing: border-box;
    font: 500 4.69vh/1.3 Pretendard, "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--ink); text-align: center; pointer-events: none; z-index: 3; }
  #cap.on { display: flex; }
  #cap.off { display: none !important; }
  #cap .chip { background: #5b8a4a; color: #fffaf0; border-radius: 40px; padding: .4vh 2vh; font-size: 3.1vh; font-weight: 700; white-space: nowrap; }
  #cap b { font-weight: 700; }
  .chipbtn { position: fixed; top: max(2.4vh, env(safe-area-inset-top)); background: var(--paper); color: var(--ink); border-radius: 1.2vh; padding: 1.1vh 2.4vh;
    font: 700 2.6vh Pretendard, system-ui, sans-serif; box-shadow: 0 3px 0 var(--edge), 0 6px 14px rgba(0,0,0,.2); border: 0; z-index: 4; }
  #tab { left: 50%; transform: translateX(-50%); pointer-events: none; display: none; }
  #tab.on { display: block; }
  #back { left: max(2vh, env(safe-area-inset-left)); }
  #subs { right: max(2vh, env(safe-area-inset-right)); }
  body.shelf-on .chipbtn { display: none; }
  #ring { position: fixed; display: none; border: 4px solid rgba(255, 250, 235, .95); border-radius: 50%; box-shadow: 0 0 0 2px rgba(60,40,20,.25);
    pointer-events: none; animation: pulse 1.2s ease-in-out infinite; box-sizing: border-box; z-index: 2; }
  #ring.hold { border-style: dashed; }
  @keyframes pulse { 0%,100% { transform: scale(1); opacity: .95 } 50% { transform: scale(1.08); opacity: .7 } }
  .ripple { position: fixed; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; border: 3px solid rgba(255,250,235,.9); pointer-events: none;
    animation: rip .6s ease-out forwards; z-index: 6; }
  @keyframes rip { to { transform: scale(9); opacity: 0; } }
  #flash { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .flashcard { position: absolute; background: #fbf6ea; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.3); padding: 1.4vh 1.4vh .8vh; box-sizing: border-box;
    display: flex; flex-direction: column; }
  .flashcard canvas { width: 100%; flex: 1; object-fit: cover; border-radius: 3px; min-height: 0; }
  .flashcard .lbl { font: 700 3.9vh Pretendard, sans-serif; text-align: center; padding-top: .6vh; }
  .flashcard .l { color: #5f8fb8; } .flashcard .r { color: #d0702a; }
  .card { position: fixed; inset: 0; display: none; align-items: center; justify-content: flex-end; padding-right: 6vw; gap: 2vh; flex-direction: column;
    pointer-events: none; z-index: 5; }
  .card.on { display: flex; }
  #endcard { justify-content: center; align-items: flex-end; }
  .card button { pointer-events: auto; font: 700 clamp(22px, 3.6vh, 40px) Pretendard, "Apple SD Gothic Neo", system-ui, sans-serif; color: var(--ink); background: var(--paper);
    border: 0; border-radius: 24px; padding: 2.2vh 5vh; min-width: 30vh; box-shadow: 0 5px 0 var(--edge), 0 14px 30px rgba(0,0,0,.3); }
  #load, #spin { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; color: #f6efdf; font: 600 2.6vh Pretendard, system-ui, sans-serif;
    pointer-events: none; z-index: 7; }
  #load.on { display: flex; background: var(--wood-dark); }
  #spin.on { display: flex; align-items: flex-start; padding-top: 10vh; }
  #hud { position: fixed; left: 10px; bottom: 8px; color: #fff; font: 12px ui-monospace, monospace; text-shadow: 0 1px 2px #000; pointer-events: none; z-index: 9; }
  /* bookshelf: the tales' closed books on the warm table (game/story/shelf.gd: BookModel boards = cover art + cut-paper title) */
  #shelf { position: fixed; inset: 0; display: none; z-index: 8; overflow-y: auto; touch-action: pan-y;
    background: radial-gradient(ellipse at 50% 38%, rgba(255,214,160,.28), rgba(0,0,0,0) 62%),
      repeating-linear-gradient(0deg, rgba(0,0,0,.10) 0 2px, rgba(0,0,0,0) 2px 15.5vh),
      linear-gradient(170deg, #7a5233, #5a3a22 45%, #3d2717); }
  #shelf.on { display: block; }
  #shelf h1 { margin: 4vh 0 1vh; text-align: center; font: 800 5.2vh Pretendard, sans-serif; color: #fbeed2; letter-spacing: .02em; text-shadow: 0 3px 0 rgba(0,0,0,.25); }
  #books { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4.4vh 3.2vw; padding: 3vh 6vw 6vh; max-width: 1500px; margin: 0 auto; }
  @media (orientation: portrait) { #books { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .book { border: 0; background: none; padding: 0; cursor: pointer; transform: rotate(var(--tilt)); transition: transform .18s; font: inherit; }
  .book:active { transform: rotate(var(--tilt)) translateY(-1vh) scale(1.03); }
  .book .board { position: relative; aspect-ratio: 1217 / 1293; border-radius: 1.2vh 1.8vh 1.8vh 1.2vh; background-size: cover; background-position: center;
    box-shadow: inset 1.6vh 0 0 var(--cloth), inset 2.1vh 0 0 var(--cloth-dark), 0 1.2vh 0 #efe3c8, 0 1.5vh 0 #cdbb96, 0 2.6vh 3vh rgba(0,0,0,.45); }
  .book .title { position: absolute; transform: translateY(-50%); filter: drop-shadow(0 .4vh .2vh rgba(0,0,0,.35)); pointer-events: none; }
  .book .name { margin-top: 2.8vh; font: 700 2.6vh Pretendard, sans-serif; color: #fbeed2; text-shadow: 0 2px 0 rgba(0,0,0,.3); }
  .book.off { opacity: .45; cursor: default; }
</style>
</head>
<body class="shelf-on">
<canvas id="c"></canvas>
<div id="flash"></div>
<div id="cap"></div>
<div id="ring"></div>
<div id="tab" class="chipbtn"></div>
<button id="back" class="chipbtn">책장</button>
<button id="subs" class="chipbtn">자막 켜짐</button>
<div id="endcard" class="card"><button id="again">다시 보기</button><button id="other">다른 동화</button></div>
<div id="shelf"><h1>팝업 동화</h1><div id="books"></div></div>
<div id="load">불러오는 중…</div>
<div id="spin">…</div>
<div id="hud"></div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
