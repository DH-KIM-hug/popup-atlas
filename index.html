<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Popup Storybook</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":94983712,"index.wasm":39514754},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

// split_pck.py: the main pack is served in parts (GitHub Pages 100 MB file limit); join them, then start.
const PCK_PARTS = ["index.pck.0", "index.pck.1"];
const PCK_SIZE = 94983712;
// Test jump (docs/WEB_BUILD.md): ?tale=turnip&beat=seed&autoplay=1&mute=1 become the same user args as a desktop
// command-line story run (`-- --tale=turnip --beat=seed --autoplay`). Without a query the shelf opens as usual.
function queryArgs() {
	const q = new URLSearchParams(window.location.search);
	const a = [];
	const id = /^[a-z0-9_]+$/;
	if (q.get('tale') && id.test(q.get('tale'))) a.push('--tale=' + q.get('tale'));
	if (q.get('beat') && id.test(q.get('beat'))) a.push('--beat=' + q.get('beat'));
	if (q.get('autoplay') === '1') a.push('--autoplay');
	if (q.get('mute') === '1') a.push('--mute');
	if (q.get('logsound') === '1') a.push('--log-sound');
	return a.length ? ['--'].concat(a) : [];
}
// iPad / iPhone: Web Audio follows the ring / silent switch unless the page asks for media playback. Safari 16.4+
// has navigator.audioSession; older iOS needs an <audio> element played inside the first touch (a silent clip), after
// which Web Audio plays like media too.
(function iosAudio() {
	try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) { /* not supported */ }
	const unlock = () => {
		const a = new Audio('data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YQAAAAA=');
		a.setAttribute('playsinline', '');
		a.play().catch(() => {});
		window.removeEventListener('touchend', unlock, true);
		window.removeEventListener('mousedown', unlock, true);
	};
	window.addEventListener('touchend', unlock, true);
	window.addEventListener('mousedown', unlock, true);
})();
function startSplitGame(override) {
	const onProgress = override['onProgress'];
	const buf = new Uint8Array(PCK_SIZE);
	let got = 0;
	const fetchPart = (i, off) => fetch(PCK_PARTS[i]).then((r) => {
		if (!r.ok) throw new Error('Failed loading ' + PCK_PARTS[i] + ' (' + r.status + ')');
		const rd = r.body.getReader();
		let o = off;
		const pump = () => rd.read().then(({ done, value }) => {
			if (done) return o;
			buf.set(value, o); o += value.length; got += value.length;
			if (onProgress) onProgress(got, PCK_SIZE);
			return pump();
		});
		return pump();
	});
	let chain = Promise.resolve(0);
	PCK_PARTS.forEach((_, i) => { chain = chain.then((off) => fetchPart(i, off)); });
	engine.config.update(override);
	engine.config.args = ['--main-pack', 'index.pck'].concat(engine.config.args).concat(queryArgs());
	return Promise.all([engine.init(engine.config.executable), chain]).then(() => {
		if (got !== PCK_SIZE) throw new Error('pck size mismatch ' + got + ' / ' + PCK_SIZE);
		return engine.preloadFile(buf.buffer, 'index.pck');  // an ArrayBuffer: a typed array would be stringified as a fileSizes key (OOM in Safari)
	}).then(() => engine.start());
}


(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		startSplitGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
