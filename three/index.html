<style>@font-face{font-family:Pretendard;src:url(./fonts/PretendardVariable.woff2)format("woff2");font-weight:45 920;font-display:block}:root{--paper:#f6efdf;--ink:#3a2a1c;--edge:#d9c9a8;--wood:#5a3a22;--wood-dark:#24160d}html,body{background:var(--wood-dark);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;height:100%;margin:0;overflow:hidden}#c{width:100vw;height:100vh;display:block;position:fixed;inset:0}#cap{background:var(--paper);min-height:14vh;box-shadow:0 4px 0 var(--edge), 0 10px 24px #00000040;box-sizing:border-box;color:var(--ink);text-align:center;pointer-events:none;z-index:3;border-radius:22px;justify-content:center;align-items:center;gap:18px;padding:12px 28px;font:500 4.69vh/1.3 Pretendard,Apple SD Gothic Neo,system-ui,sans-serif;display:none;position:fixed;bottom:2.54vh;left:12%;right:12%}#cap.on{display:flex}#cap.off{display:none!important}#cap .chip{color:#fffaf0;white-space:nowrap;background:#5b8a4a;border-radius:40px;padding:.4vh 2vh;font-size:3.1vh;font-weight:700}#cap b{font-weight:700}.chipbtn{top:max(2.4vh, env(safe-area-inset-top));background:var(--paper);color:var(--ink);box-shadow:0 3px 0 var(--edge), 0 6px 14px #0003;z-index:4;border:0;border-radius:1.2vh;padding:1.1vh 2.4vh;font:700 2.6vh Pretendard,system-ui,sans-serif;position:fixed}#tab{pointer-events:none;display:none;left:50%;transform:translate(-50%)}#tab.on{display:block}#back{left:max(2vh, env(safe-area-inset-left))}#subs{right:max(2vh, env(safe-area-inset-right))}body.shelf-on .chipbtn{display:none}#ring{pointer-events:none;box-sizing:border-box;z-index:2;border:4px solid #fffaebf2;border-radius:50%;animation:1.2s ease-in-out infinite pulse;display:none;position:fixed;box-shadow:0 0 0 2px #3c281440}#ring.hold{border-style:dashed}@keyframes pulse{0%,to{opacity:.95;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}.ripple{pointer-events:none;z-index:6;border:3px solid #fffaebe6;border-radius:50%;width:10px;height:10px;margin:-5px 0 0 -5px;animation:.6s ease-out forwards rip;position:fixed}@keyframes rip{to{opacity:0;transform:scale(9)}}#flash{pointer-events:none;z-index:2;position:fixed;inset:0}.flashcard{box-sizing:border-box;background:#fbf6ea;border-radius:6px;flex-direction:column;padding:1.4vh 1.4vh .8vh;display:flex;position:absolute;box-shadow:0 8px 24px #0000004d}.flashcard canvas{object-fit:cover;border-radius:3px;flex:1;width:100%;min-height:0}.flashcard .lbl{text-align:center;padding-top:.6vh;font:700 3.9vh Pretendard,sans-serif}.flashcard .l{color:#5f8fb8}.flashcard .r{color:#d0702a}.card{pointer-events:none;z-index:5;flex-direction:column;justify-content:flex-end;align-items:center;gap:2vh;padding-right:6vw;display:none;position:fixed;inset:0}.card.on{display:flex}#endcard{justify-content:center;align-items:flex-end}.card button{pointer-events:auto;color:var(--ink);background:var(--paper);min-width:30vh;box-shadow:0 5px 0 var(--edge), 0 14px 30px #0000004d;border:0;border-radius:24px;padding:2.2vh 5vh;font:700 clamp(22px,3.6vh,40px) Pretendard,Apple SD Gothic Neo,system-ui,sans-serif}#load,#spin{color:#f6efdf;pointer-events:none;z-index:7;justify-content:center;align-items:center;font:600 2.6vh Pretendard,system-ui,sans-serif;display:none;position:fixed;inset:0}#load.on{background:var(--wood-dark);display:flex}#spin.on{align-items:flex-start;padding-top:10vh;display:flex}#hud{color:#fff;text-shadow:0 1px 2px #000;pointer-events:none;z-index:9;font:12px ui-monospace,monospace;position:fixed;bottom:8px;left:10px}#shelf{z-index:8;touch-action:pan-y;background:radial-gradient(at 50% 38%,#ffd6a047,#0000 62%),repeating-linear-gradient(0deg,#0000001a 0 2px,#0000 2px 15.5vh),linear-gradient(170deg,#7a5233,#5a3a22 45%,#3d2717);display:none;position:fixed;inset:0;overflow-y:auto}#shelf.on{display:block}#shelf h1{text-align:center;color:#fbeed2;letter-spacing:.02em;text-shadow:0 3px #00000040;margin:4vh 0 1vh;font:800 5.2vh Pretendard,sans-serif}#books{grid-template-columns:repeat(4,minmax(0,1fr));gap:4.4vh 3.2vw;max-width:1500px;margin:0 auto;padding:3vh 6vw 6vh;display:grid}@media (orientation:portrait){#books{grid-template-columns:repeat(2,minmax(0,1fr))}}.book{cursor:pointer;transform:rotate(var(--tilt));font:inherit;background:0 0;border:0;padding:0;transition:transform .18s}.book:active{transform:rotate(var(--tilt)) translateY(-1vh) scale(1.03)}.book .board{aspect-ratio:1217/1293;box-shadow:inset 1.6vh 0 0 var(--cloth), inset 2.1vh 0 0 var(--cloth-dark), 0 1.2vh 0 #efe3c8, 0 1.5vh 0 #cdbb96, 0 2.6vh 3vh #00000073;background-position:50%;background-size:cover;border-radius:1.2vh 1.8vh 1.8vh 1.2vh;position:relative}.book .title{filter:drop-shadow(0 .4vh .2vh #00000059);pointer-events:none;position:absolute;transform:translateY(-50%)}.book .name{color:#fbeed2;text-shadow:0 2px #0000004d;margin-top:2.8vh;font:700 2.6vh Pretendard,sans-serif}.book.off{opacity:.45;cursor:default}</style>
